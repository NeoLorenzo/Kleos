name: Validate revised issue 2 branch

on:
  push:
    branches: ["fix/issue-2-edit-delete-measurements"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Run privacy check
        run: npm run check:privacy

      - name: Build static export
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: "/Kleos"
          NEXT_PUBLIC_SUPABASE_URL: "https://jhpsggjphoqyygthqfki.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_-r71Jkgx3TiyY_2_RtMUqQ_XWdW3Beh"
        run: npm run build
