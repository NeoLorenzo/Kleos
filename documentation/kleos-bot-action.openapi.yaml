openapi: 3.1.0
info:
  title: Kleos Bot API
  version: 1.0.0
  description: >-
    Private server-side API used by Kleos Bot to retrieve compact canonical
    evaluation evidence and persist one immutable eight-vector evaluation.
servers:
  - url: https://jhpsggjphoqyygthqfki.supabase.co/functions/v1/kleos-bot-api
paths:
  /evidence:
    get:
      operationId: getKleosEvaluationEvidence
      summary: Get compact canonical evidence for one Kleos evaluation
      description: >-
        Returns current canonical Kleos evidence after deterministic server-side
        compaction. High-volume Apple Health and financial row sets are summarized
        before they reach the model. Do not use memory or external personal data as
        substitute evidence when this action succeeds.
      x-openai-isConsequential: false
      security:
        - KleosBotToken: []
      responses:
        "200":
          description: Compact evaluation evidence
          content:
            application/json:
              schema:
                type: object
                required:
                  - evidence_schema_version
                  - methodology_version
                  - generated_at
                  - evidence
                properties:
                  evidence_schema_version:
                    type: string
                  methodology_version:
                    type: string
                  generated_at:
                    type: string
                    format: date-time
                  evidence:
                    type: object
                    additionalProperties: true
        "401":
          description: Invalid API token
        "500":
          description: Evidence retrieval failed
  /evaluations:
    post:
      operationId: persistKleosEvaluation
      summary: Persist one validated immutable Kleos vector evaluation
      description: >-
        Persists exactly eight canonical vector results using the existing
        privileged Kleos Bot snapshot writer. Generate one unique execution key
        at the start of the evaluation and reuse that same key if this exact
        persistence request is retried.
      x-openai-isConsequential: true
      security:
        - KleosBotToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - execution_key
                - results
              properties:
                execution_key:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: Unique per-evaluation idempotency key, preferably UUID-style.
                overall_score:
                  oneOf:
                    - type: number
                      minimum: 0
                      maximum: 100
                    - type: "null"
                  description: Optional overall score. Null is allowed.
                results:
                  type: array
                  minItems: 8
                  maxItems: 8
                  items:
                    $ref: "#/components/schemas/VectorResult"
      responses:
        "200":
          description: Snapshot persisted or an exact retry deduplicated
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - execution_key
                  - evaluated_at
                  - methodology_version
                  - snapshot_id
                  - created
                properties:
                  ok:
                    type: boolean
                  execution_key:
                    type: string
                  evaluated_at:
                    type: string
                    format: date-time
                  methodology_version:
                    type: string
                  snapshot_id:
                    type: string
                    format: uuid
                  created:
                    type: boolean
        "400":
          description: Invalid evaluation payload
        "401":
          description: Invalid API token
        "500":
          description: Persistence failed
components:
  securitySchemes:
    KleosBotToken:
      type: apiKey
      in: header
      name: x-kleos-bot-token
  schemas:
    VectorResult:
      type: object
      additionalProperties: false
      required:
        - vector_id
        - status
        - score
        - confidence
        - commentary
      properties:
        vector_id:
          type: string
          enum:
            - physical
            - psychological
            - intellectual
            - professional
            - financial
            - relational
            - creative
            - experiential
        status:
          type: string
          enum:
            - assessed
            - unknown
        score:
          oneOf:
            - type: number
              minimum: 0
              maximum: 100
            - type: "null"
        confidence:
          type: string
          enum:
            - low
            - medium
            - high
            - unknown
        commentary:
          type: string
          minLength: 1
