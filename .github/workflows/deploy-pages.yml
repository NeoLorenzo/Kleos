name: Deploy Kleos to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run validation
        run: |
          npm test
          npm run check:privacy

      - name: Build static export
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_SUPABASE_URL: "https://jhpsggjphoqyygthqfki.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_-r71Jkgx3TiyY_2_RtMUqQ_XWdW3Beh"
        run: npm run build

      - name: Check exported site privacy
        run: npm run check:privacy -- out

      - name: Smoke test production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/manifest.webmanifest
          test -f out/physical/index.html
          grep -q "Kleos" out/index.html
          if grep -R -n -E --include='*.html' --include='*.js' --include='*.css' --include='*.json' --include='*.webmanifest' '(/Kleos/|neolorenzo\.github\.io/Kleos)' out; then
            echo "Legacy Kleos GitHub Pages path found in production artifact."
            exit 1
          fi

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test live Kleos
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3 \
            https://kleos.fabbrosystems.com/ --output /tmp/kleos.html
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3 \
            https://kleos.fabbrosystems.com/manifest.webmanifest --output /tmp/kleos-manifest.webmanifest
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3 \
            https://kleos.fabbrosystems.com/physical/ --output /tmp/kleos-physical.html
          grep -q "Kleos" /tmp/kleos.html
          if grep -E -q '(/Kleos/|neolorenzo\.github\.io/Kleos)' /tmp/kleos.html /tmp/kleos-physical.html; then
            echo "Legacy Kleos deployment path found on the live domain."
            exit 1
          fi
